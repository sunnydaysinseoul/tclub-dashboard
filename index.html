<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체육관 전광판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 편집 도구 막대 (관리자 로그인 후에만 보임) -->
<div id="toolbar" hidden>
  <div class="tb-row">
    <span class="tb-label">크기</span>
    <button type="button" data-size="32">작게</button>
    <button type="button" data-size="48">보통</button>
    <button type="button" data-size="64">크게</button>
    <button type="button" data-size="88">아주 크게</button>
    <input id="sizeInput" type="number" min="8" max="400" step="1" value="48" title="글자 크기(px)">
    <span class="tb-unit">px</span>
    <button type="button" id="sizeApply">적용</button>
    <span class="tb-sep"></span>
    <button type="button" id="btnBold" class="b">굵게</button>
    <button type="button" id="btnUnderline" class="u">밑줄</button>
    <span class="tb-sep"></span>
    <button type="button" class="sw" data-color="#FFFFFF" style="background:#FFFFFF" title="흰색"></button>
    <button type="button" class="sw" data-color="#FFD400" style="background:#FFD400" title="노란색"></button>
    <button type="button" class="sw" data-color="#FF3B30" style="background:#FF3B30" title="빨간색"></button>
    <button type="button" class="sw" data-color="#7ED957" style="background:#7ED957" title="초록색"></button>
    <button type="button" class="sw" data-color="#4DA3FF" style="background:#4DA3FF" title="파란색"></button>
    <input id="colorInput" type="color" value="#ffffff" title="다른 색 고르기">
    <span class="tb-sep"></span>
    <button type="button" id="btnClear">서식 지우기</button>
    <span class="tb-spacer"></span>
    <button type="button" id="btnToday">오늘 날짜 넣기</button>
    <button type="button" id="btnArchive">수업 보관함</button>
    <button type="button" id="btnCancel">취소</button>
    <button type="button" id="btnSave" class="primary">저장 및 적용</button>
    <button type="button" id="btnLogout">로그아웃</button>
  </div>
  <div id="status" aria-live="polite"></div>
</div>

<!-- 전광판 화면: 1920px 기준으로 그린 뒤 화면 크기에 맞춰 확대/축소 -->
<div id="stage">
  <div id="main">
    <section class="panel" id="left">
      <div class="date ed" id="missionDate" data-ph="기간 (예: 11월 16일~27일)"></div>
      <div class="title ed" id="missionTitle" data-ph="제목"></div>
      <div class="body ed" id="missionBody" data-ph="이번주 미션 내용을 입력하세요"></div>
    </section>
    <div id="divider"></div>
    <section class="panel" id="right">
      <div class="date ed" id="lessonDate" data-ph="비워두면 오늘 날짜가 자동으로 표시됩니다"></div>
      <div class="title ed" id="lessonTitle" data-ph="제목"></div>
      <div class="body ed" id="lessonBody" data-ph="오늘의 수업 내용을 입력하세요"></div>
    </section>
  </div>
  <div id="ticker">
    <div id="tickerLabel">공지사항</div>
    <div id="tickerView">
      <div id="tickerTrack"></div>
      <div id="noticeEdit" data-ph="하단에 흐를 공지 문구를 입력하세요"></div>
    </div>
  </div>
</div>

<button type="button" id="editBtn">편집</button>

<!-- 관리자 로그인 -->
<div class="modal" id="loginModal" hidden>
  <form class="dialog small" id="loginForm">
    <div class="dlg-head"><span>관리자 로그인</span><button type="button" class="x" data-close>닫기</button></div>
    <div class="dlg-body">
      <label for="pwInput">비밀번호</label>
      <input id="pwInput" type="password" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
    </div>
    <div class="dlg-foot"><button type="button" data-close>닫기</button><button type="submit" class="primary">로그인</button></div>
  </form>
</div>

<!-- 수업 보관함 -->
<div class="modal" id="archiveModal" hidden>
  <div class="dialog">
    <div class="dlg-head"><span>수업 보관함</span><button type="button" class="x" data-close>닫기</button></div>
    <div class="dlg-body">
      <div class="arc-tools">
        <input id="arcSearch" type="search" placeholder="검색 (예: 샌드백, 11월)">
        <select id="arcType">
          <option value="all">전체</option>
          <option value="lesson">오늘의 수업</option>
          <option value="mission">이번주 미션</option>
        </select>
      </div>
      <p class="hint">저장할 때마다 미션과 수업 내용이 자동으로 이곳에 보관됩니다. 같은 내용은 한 번만 보관돼요.</p>
      <div id="arcList"></div>
    </div>
    <div class="dlg-foot"><button type="button" data-close>닫기</button></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
